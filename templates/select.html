<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleziona Drink</title>
    <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body class="page-background">
    <h1>Seleziona un drink</h1>
    <div class="back-button-container">
        <form action="/" method="get">
            <button type="submit" class="back-button">←</button>
        </form>

        <form method="get" action="/drink-details">
            <select name="drink">
                <option value="" disabled selected>-- Seleziona un drink --</option>
                {% for drink in drinks %}
                    <option value="{{ drink[0] }}">{{ drink[1] }}</option>
                {% endfor %}
            </select>
            <button type="submit">Conferma</button>
        </form>
    </div>
</body>
</html>
